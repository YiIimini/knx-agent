name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    name: knx-agent plugin (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Self-checks (98)
        working-directory: plugin
        run: node test/smoke.mjs

  python:
    name: reference prototype (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Protocol tests (43)
        working-directory: python-prototype
        run: python -m unittest discover -s tests -t . -v
