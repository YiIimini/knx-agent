name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    name: knx-agent plugin (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Self-checks (98)
        working-directory: plugin
        run: node test/smoke.mjs
      - name: Button legibility (19)
        working-directory: plugin
        run: node test/contrast.mjs

  python:
    name: reference prototype (python ${{ matrix.python }})
    # ubuntu-latest no longer ships a 3.9 build of setup-python; 22.04 does.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the prototype
        working-directory: python-prototype
        run: python -m pip install --quiet -e .
      - name: Protocol tests (43)
        working-directory: python-prototype
        run: python -m unittest discover -s tests -t . -v
